<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curbloom — Monthly Delivery SOP</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:       #0b0f14;
  --bg1:      #0f1419;
  --bg2:      #141b24;
  --bg3:      #1a2535;
  --bg4:      #1e2d3d;
  --border:   #1e2d3d;
  --green:    #2d6a4f;
  --green-b:  #52b788;
  --green-l:  #74c69d;
  --green-p:  #b7e4c7;
  --orange:   #ff914d;
  --orange-d: #c4693a;
  --gold:     #f4c842;
  --gold-d:   #a8860a;
  --purple:   #c084fc;
  --text:     #e8eef4;
  --muted:    #8a9bb0;
  --dim:      #3a4a5a;
}

body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

.header {
  background: var(--bg1);
  border-bottom: 2px solid var(--orange);
  padding: 1rem 2rem;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
}
.logo { font-family: 'Syne', sans-serif; font-size: 1.1rem; font-weight: 800; color: var(--orange); letter-spacing: 2px; }
.logo-sub { font-family: 'DM Mono', monospace; font-size: 0.58rem; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-top: 1px; }
.back-link { font-family: 'DM Mono', monospace; font-size: 0.65rem; color: var(--muted); text-decoration: none; padding: 4px 10px; border: 1px solid var(--border); border-radius: 5px; transition: all 0.15s; }
.back-link:hover { color: var(--green-b); border-color: var(--green); }

.app { display: grid; grid-template-columns: 280px 1fr; min-height: calc(100vh - 58px); }

.sidebar {
  background: var(--bg1);
  border-right: 1px solid var(--border);
  padding: 1.2rem;
  overflow-y: auto;
  display: flex; flex-direction: column; gap: 1.2rem;
}

.sidebar-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.58rem; letter-spacing: 2px; text-transform: uppercase; color: var(--orange);
  margin-bottom: 0.5rem;
}

.client-list { display: flex; flex-direction: column; gap: 0.4rem; }
.client-btn {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
  padding: 0.7rem 0.9rem; cursor: pointer; transition: all 0.15s; text-align: left;
  position: relative;
}
.client-btn:hover { border-color: var(--orange); }
.client-btn.active { border-color: var(--orange); background: #1a1208; }
.client-btn::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  background: transparent; border-radius: 8px 0 0 8px; transition: background 0.15s;
}
.client-btn.active::before { background: var(--orange); }
.client-name { font-weight: 700; font-size: 0.85rem; color: var(--text); }
.client-tier { font-size: 0.68rem; margin-top: 2px; }
.tier-founder { color: var(--green-b); }
.tier-growth  { color: var(--gold); }
.tier-premium { color: var(--purple); }
.client-market { font-size: 0.65rem; color: var(--muted); margin-top: 1px; }

.no-clients-notice {
  background: rgba(255,145,77,0.08);
  border: 1px solid rgba(255,145,77,0.2);
  border-radius: 8px;
  padding: 0.85rem;
  font-size: 0.72rem;
  color: #f4a261;
  line-height: 1.6;
}
.no-clients-notice a { color: var(--orange); font-weight: 600; text-decoration: underline; }

.tier-assign-row { display: flex; align-items: center; justify-content: space-between; margin-top: 0.5rem; }
.tier-assign-label { font-family: 'DM Mono', monospace; font-size: 0.6rem; color: var(--muted); }
.tier-select {
  background: var(--bg3); border: 1px solid var(--border); border-radius: 5px;
  padding: 3px 6px; color: var(--text); font-size: 0.7rem;
  font-family: 'DM Sans', sans-serif; cursor: pointer;
}
.tier-select:focus { outline: none; border-color: var(--orange); }

.progress-block { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 1rem; }
.progress-title { font-family: 'DM Mono', monospace; font-size: 0.6rem; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 0.75rem; }
.progress-bar-wrap { background: var(--bg3); border-radius: 4px; height: 6px; margin-bottom: 0.5rem; overflow: hidden; }
.progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--orange), var(--gold)); border-radius: 4px; transition: width 0.4s ease; }
.progress-nums { display: flex; justify-content: space-between; font-family: 'DM Mono', monospace; font-size: 0.62rem; color: var(--muted); }
.progress-pct { font-size: 1.4rem; font-weight: 800; color: var(--orange); font-family: 'Syne', sans-serif; }

.time-block { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 1rem; }
.time-row { display: flex; justify-content: space-between; align-items: center; padding: 0.3rem 0; border-bottom: 1px solid var(--dim); }
.time-row:last-child { border-bottom: none; }
.time-label { font-size: 0.72rem; color: var(--muted); }
.time-val { font-family: 'DM Mono', monospace; font-size: 0.72rem; color: var(--text); }
.time-total { color: var(--orange); font-weight: 700; }

.month-row { display: flex; gap: 0.5rem; align-items: center; }
.month-row select {
  flex: 1; background: var(--bg3); border: 1px solid var(--border); border-radius: 6px;
  padding: 0.45rem 0.6rem; color: var(--text); font-size: 0.78rem;
  font-family: 'DM Sans', sans-serif;
}
.month-row select:focus { outline: none; border-color: var(--orange); }

.reset-btn {
  background: transparent; border: 1px solid var(--dim); border-radius: 6px;
  padding: 4px 10px; color: var(--muted); font-size: 0.65rem; cursor: pointer;
  font-family: 'DM Mono', monospace; transition: all 0.15s;
}
.reset-btn:hover { border-color: #ef4444; color: #ef4444; }

.main { padding: 1.5rem 2rem; overflow-y: auto; }

.phase { margin-bottom: 2rem; }
.phase-header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.85rem; }
.phase-num {
  font-family: 'DM Mono', monospace; font-size: 0.58rem; letter-spacing: 1.5px;
  color: var(--muted); background: var(--bg2); border: 1px solid var(--border);
  border-radius: 4px; padding: 2px 7px;
}
.phase-title { font-family: 'Syne', sans-serif; font-size: 0.95rem; font-weight: 700; color: var(--text); }
.phase-time {
  font-family: 'DM Mono', monospace; font-size: 0.62rem; color: var(--muted);
  background: var(--bg2); border: 1px solid var(--border); border-radius: 4px;
  padding: 2px 8px; margin-left: auto;
}
.phase-line { flex: 1; height: 1px; background: var(--border); }

.steps { display: flex; flex-direction: column; gap: 0.5rem; }

.step {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0.85rem 1rem;
  display: grid;
  grid-template-columns: 28px 1fr auto;
  gap: 0.75rem;
  align-items: start;
  cursor: pointer;
  transition: all 0.18s;
  position: relative;
}
.step:hover { border-color: var(--orange-d); }
.step.done { background: #0e1a0e; border-color: var(--green); opacity: 0.75; }
.step.done:hover { opacity: 1; }
.step.tier-locked { opacity: 0.35; cursor: default; pointer-events: none; }

.step-check {
  width: 22px; height: 22px; border-radius: 6px;
  border: 2px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: all 0.18s; margin-top: 1px;
  background: var(--bg3);
}
.step.done .step-check { background: var(--green); border-color: var(--green-b); }
.step-check-icon { font-size: 0.7rem; display: none; }
.step.done .step-check-icon { display: block; }

.step-title { font-size: 0.84rem; font-weight: 600; color: var(--text); margin-bottom: 3px; line-height: 1.3; }
.step.done .step-title { text-decoration: line-through; color: var(--muted); }
.step-desc { font-size: 0.72rem; color: var(--muted); line-height: 1.55; }
.step-tool {
  font-family: 'DM Mono', monospace; font-size: 0.58rem; letter-spacing: 0.5px;
  padding: 2px 7px; border-radius: 10px; white-space: nowrap; margin-top: 6px;
  display: inline-block;
}
.tool-c4      { background: #0d2e1c; color: var(--green-b); border: 1px solid var(--green); }
.tool-designer { background: #1a1208; color: var(--gold); border: 1px solid var(--gold-d); }
.tool-report  { background: #0f1a2e; color: #60a5fa; border: 1px solid #1a3a6a; }
.tool-email   { background: #1a0e2e; color: var(--purple); border: 1px solid #4a1a7a; }
.tool-canva   { background: #2a1a0a; color: var(--orange); border: 1px solid var(--orange-d); }
.tool-manual  { background: var(--bg3); color: var(--muted); border: 1px solid var(--dim); }

.step-tier-badge {
  font-family: 'DM Mono', monospace; font-size: 0.56rem; padding: 2px 6px;
  border-radius: 8px; white-space: nowrap; align-self: start;
}
.badge-all      { background: var(--bg3); color: var(--muted); border: 1px solid var(--dim); }
.badge-growth   { background: #1a1600; color: var(--gold); border: 1px solid var(--gold-d); }
.badge-premium  { background: #1a0e2e; color: var(--purple); border: 1px solid #4a1a7a; }

.locked-notice { font-size: 0.65rem; color: var(--dim); font-style: italic; margin-top: 3px; }

.delivery-banner {
  background: #1a1208;
  border: 1px solid var(--orange-d);
  border-radius: 10px;
  padding: 1rem 1.2rem;
  margin-bottom: 1.5rem;
  display: flex; gap: 0.75rem; align-items: flex-start;
}
.delivery-icon { font-size: 1.2rem; flex-shrink: 0; }
.delivery-text { font-size: 0.76rem; color: var(--orange); line-height: 1.65; }
.delivery-text strong { color: #ffc080; }

.empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 60vh; gap: 0.75rem; color: var(--dim); text-align: center;
}
.empty-state .icon { font-size: 2.5rem; }
.empty-state p { font-size: 0.8rem; color: var(--muted); max-width: 260px; line-height: 1.6; }

.complete-banner {
  background: #0d2e1c; border: 1px solid var(--green-b); border-radius: 10px;
  padding: 1rem 1.2rem; margin-bottom: 1.5rem; display: none;
  align-items: center; gap: 0.75rem;
}
.complete-banner.show { display: flex; }
.complete-text { font-size: 0.82rem; color: var(--green-p); line-height: 1.6; }
.complete-text strong { color: #fff; }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 3px; }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="logo">CURBLOOM</div>
    <div class="logo-sub">Monthly Delivery SOP</div>
  </div>
  <a href="index.html" class="back-link">← Playbook</a>
</div>

<div class="app">
  <div class="sidebar">
    <div>
      <div class="sidebar-label">Clients</div>
      <div class="client-list" id="clientList"></div>
    </div>

    <div>
      <div class="sidebar-label">Month</div>
      <div class="month-row">
        <select id="monthSelect" onchange="render()"></select>
        <button class="reset-btn" onclick="resetChecklist()" title="Reset checklist">↺</button>
      </div>
    </div>

    <div class="progress-block" id="progressBlock" style="display:none">
      <div class="progress-title">This Month</div>
      <div class="progress-pct" id="progressPct">0%</div>
      <div class="progress-bar-wrap" style="margin-top:0.5rem">
        <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
      </div>
      <div class="progress-nums">
        <span id="progressDone">0 done</span>
        <span id="progressTotal">0 steps</span>
      </div>
    </div>

    <div class="time-block" id="timeBlock" style="display:none">
      <div class="progress-title">Time Estimate</div>
      <div id="timeRows"></div>
    </div>
  </div>

  <div class="main" id="main">
    <div class="empty-state">
      <div class="icon">📋</div>
      <p>Onboard a client first to use the Monthly SOP.</p>
      <a href="onboarding.html" style="color:var(--orange);font-size:0.82rem;margin-top:0.5rem;">Start onboarding →</a>
    </div>
  </div>
</div>

<script>
// ── STORAGE KEYS ──
const CLIENTS_KEY = 'curbloom_clients';  // shared with all tools
const CHECKS_KEY  = 'sop_checks';        // SOP-specific check state
const TIERS_KEY   = 'sop_tiers';         // tier assignments per client

let clients = [];
let tierMap = {};   // clientId → tier
let activeIdx = null;
let checkState = {};

try { checkState = JSON.parse(localStorage.getItem(CHECKS_KEY) || '{}'); } catch(e) {}
try { tierMap = JSON.parse(localStorage.getItem(TIERS_KEY) || '{}'); } catch(e) {}

function saveTiers() { localStorage.setItem(TIERS_KEY, JSON.stringify(tierMap)); }
function saveChecks() { localStorage.setItem(CHECKS_KEY, JSON.stringify(checkState)); }

function getClientId(c) { return c.id || c.name; }
function getClientTier(c) { return tierMap[getClientId(c)] || 'growth'; }

// ── MONTHS ──
function populateMonths() {
  const sel = document.getElementById('monthSelect');
  sel.innerHTML = '';
  const now = new Date();
  for (let i = 0; i < 12; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() + i, 1);
    const label = d.toLocaleString('default', { month: 'long', year: 'numeric' });
    const val = `${d.getFullYear()}-${d.getMonth()}`;
    const opt = document.createElement('option');
    opt.value = val; opt.textContent = label;
    if (i === 0) opt.selected = true;
    sel.appendChild(opt);
  }
}

function getMonthKey() { return document.getElementById('monthSelect').value; }
function getCheckKey(idx) { return `${getClientId(clients[idx])}__${getMonthKey()}`; }

// ── SOP DEFINITION ──
const PHASES = [
  {
    num: '01', title: 'Prep — Know What You\'re Delivering', time: '10 min',
    steps: [
      { id: 'prep-calendar', title: 'Pull the 30-day content calendar from C4', desc: 'Open C4, select the client, and confirm this month\'s 30-day plan. Note any days that need real-world data — market stats, recent closings, local events.', tool: 'C4', toolClass: 'tool-c4', tiers: ['all'], time: 5 },
      { id: 'prep-intel', title: 'Gather real-world intel for Market Update posts', desc: 'Pull 2–3 current stats for the client\'s market: median home price, days on market, inventory. Replace placeholders in Market Update captions. 5 min with Zillow or Realtor.com.', tool: 'Manual', toolClass: 'tool-manual', tiers: ['all'], time: 5 },
    ]
  },
  {
    num: '02', title: 'Captions — Generate & Customize', time: '30 min',
    steps: [
      { id: 'cap-generate', title: 'Generate all 30 captions in C4', desc: 'Click each day in C4 and copy the caption. Paste into a Google Doc — one caption per section, labeled by day number and platform.', tool: 'C4', toolClass: 'tool-c4', tiers: ['all'], time: 15 },
      { id: 'cap-customize', title: 'Customize the 4 Market Update captions with real stats', desc: 'Find the 4 Market Update days in the doc. Replace placeholder numbers with the real data from prep. This is what makes the content feel local and credible.', tool: 'Manual', toolClass: 'tool-manual', tiers: ['all'], time: 10 },
      { id: 'cap-review', title: 'Read every caption out loud — does it sound like the client?', desc: 'Quick gut check. If anything sounds generic, stiff, or wrong for their voice, fix it now. Personality/Trust and Engagement posts need this most.', tool: 'Manual', toolClass: 'tool-manual', tiers: ['all'], time: 10 },
    ]
  },
  {
    num: '03', title: 'Graphics — Design & Export', time: '60 min',
    steps: [
      { id: 'graphics-market', title: 'Design 4 Market Update graphics', desc: 'Use Post Designer. Bold stat front and center, client brand colors. These are the posts that get saved and shared — make them clean.', tool: 'Post Designer', toolClass: 'tool-designer', tiers: ['growth', 'premium'], time: 20 },
      { id: 'graphics-trust', title: 'Design 4 Personality/Trust graphics', desc: 'Photo-forward. Use Bold Overlay layout. Client\'s face or a behind-the-scenes shot. If no photo, strong color background with their hook as the headline.', tool: 'Post Designer', toolClass: 'tool-designer', tiers: ['growth', 'premium'], time: 20 },
      { id: 'graphics-social-proof', title: 'Design 4 Social Proof / Engagement graphics', desc: 'Quote layout for testimonials, Clean Minimal for engagement polls or questions. Keep copy minimal — let the design carry it.', tool: 'Post Designer', toolClass: 'tool-designer', tiers: ['growth', 'premium'], time: 15 },
      { id: 'graphics-lead-gen', title: 'Design remaining Lead Gen + Educational graphics', desc: 'Bold Overlay or Split Half for lead gen hooks. Clean Minimal for educational carousels. Export all as PNGs named by day number.', tool: 'Post Designer', toolClass: 'tool-designer', tiers: ['growth', 'premium'], time: 20 },
    ]
  },
  {
    num: '04', title: 'Calendar — Build the Posting Schedule', time: '15 min',
    steps: [
      { id: 'cal-build', title: 'Build the client\'s 30-day posting calendar', desc: 'Create a simple table: Date | Platform | Content Type | Caption | Graphic. This is what you hand the client — they post from this.', tool: 'Manual', toolClass: 'tool-manual', tiers: ['all'], time: 10 },
      { id: 'cal-dates', title: 'Map the 30 posts to actual calendar dates', desc: 'Day 1 = 1st of the month. Assign each day number to a real date and note the platform. Flag any holidays in the client\'s market.', tool: 'Manual', toolClass: 'tool-manual', tiers: ['all'], time: 5 },
    ]
  },
  {
    num: '05', title: 'Scheduling — Premium Only', time: '45 min',
    steps: [
      { id: 'schedule-access', title: 'Confirm access to client\'s Meta Business Suite', desc: 'Confirm you have page admin access or credentials. Set this up before the first Premium month — don\'t wait until delivery day.', tool: 'Manual', toolClass: 'tool-manual', tiers: ['premium'], time: 5 },
      { id: 'schedule-upload', title: 'Upload all graphics to Meta Business Suite', desc: 'Upload PNGs to the Media Library before scheduling. Confirm each image renders correctly at both Instagram square and Facebook landscape sizes.', tool: 'Manual', toolClass: 'tool-manual', tiers: ['premium'], time: 15 },
      { id: 'schedule-posts', title: 'Schedule all 30 posts', desc: 'Pair each caption with its graphic and schedule at the correct date/time. Instagram: 8–10am or 6–8pm. Facebook: 1–3pm. Stagger platforms by 1–2 hours.', tool: 'Manual', toolClass: 'tool-manual', tiers: ['premium'], time: 25 },
    ]
  },
  {
    num: '06', title: 'Report — Pull the Numbers', time: '10 min',
    steps: [
      { id: 'report-pull', title: 'Pull last month\'s performance metrics', desc: 'From Meta Business Suite or the client\'s Insights: follower count, reach, profile visits, top post. Log them in the Reporting Dashboard.', tool: 'Reports', toolClass: 'tool-report', tiers: ['premium'], time: 5 },
      { id: 'report-generate', title: 'Generate the monthly PDF report', desc: 'Open the Reporting Dashboard, enter the metrics, click Generate PDF. This is the client-facing document that proves the value of the service.', tool: 'Reports', toolClass: 'tool-report', tiers: ['premium'], time: 5 },
    ]
  },
  {
    num: '07', title: 'Delivery — Send Everything to the Client', time: '10 min',
    steps: [
      { id: 'deliver-package', title: 'Package all deliverables', desc: 'Founder: captions doc + content calendar. Growth: captions doc + calendar + graphics folder. Premium: everything is already scheduled — send the report and a summary note.', tool: 'Manual', toolClass: 'tool-manual', tiers: ['all'], time: 5 },
      { id: 'deliver-send', title: 'Send delivery email to client', desc: 'Keep it short: "Here\'s your content for [Month]. 30 posts, ready to go. [Quick note on this month.] Let me know if you have questions." Attach or link everything.', tool: 'Email', toolClass: 'tool-email', tiers: ['all'], time: 5 },
      { id: 'deliver-confirm', title: 'Confirm client received and has no questions', desc: 'Follow up once if no response in 48 hours. Log the delivery date. This is your proof of delivery and the start of the clock for next month.', tool: 'Manual', toolClass: 'tool-manual', tiers: ['all'], time: 0 },
    ]
  },
];

function stepApplies(step, tier) {
  if (step.tiers.includes('all')) return true;
  if (tier === 'premium') return true;
  if (tier === 'growth' && step.tiers.includes('growth')) return true;
  return false;
}

function getMonthLabel() {
  const sel = document.getElementById('monthSelect');
  return sel.options[sel.selectedIndex]?.text || '';
}

// ── LOAD CLIENTS ──
function loadClients() {
  try { clients = JSON.parse(localStorage.getItem(CLIENTS_KEY) || '[]'); } catch(e) {}

  const list = document.getElementById('clientList');

  if (clients.length === 0) {
    list.innerHTML = `<div class="no-clients-notice">No clients onboarded yet.<br><a href="onboarding.html">Start onboarding →</a></div>`;
    activeIdx = null;
    render();
    return;
  }

  if (activeIdx === null) activeIdx = 0;

  list.innerHTML = clients.map((c, i) => {
    const tier = getClientTier(c);
    const tierLabel = { founder: 'Founder', growth: 'Growth', premium: 'Premium' }[tier];
    const tierClass = { founder: 'tier-founder', growth: 'tier-growth', premium: 'tier-premium' }[tier];
    return `
      <div class="client-btn ${i === activeIdx ? 'active' : ''}" onclick="selectClient(${i})">
        <div class="client-name">${c.name}</div>
        <div class="client-tier ${tierClass}">${tierLabel}</div>
        <div class="client-market">${c.community || ''} · ${c.market || ''}</div>
      </div>
      ${i === activeIdx ? `
        <div class="tier-assign-row" style="margin-bottom:0.5rem;">
          <span class="tier-assign-label">Tier:</span>
          <select class="tier-select" onchange="assignTier(${i}, this.value)">
            <option value="founder" ${tier==='founder'?'selected':''}>Founder</option>
            <option value="growth"  ${tier==='growth'?'selected':''}>Growth</option>
            <option value="premium" ${tier==='premium'?'selected':''}>Premium</option>
          </select>
        </div>
      ` : ''}
    `;
  }).join('');

  render();
}

function assignTier(idx, tier) {
  const cid = getClientId(clients[idx]);
  tierMap[cid] = tier;
  saveTiers();
  loadClients();
}

function selectClient(idx) {
  activeIdx = idx;
  loadClients();
}

// ── RENDER MAIN ──
function render() {
  if (activeIdx === null || clients.length === 0) {
    document.getElementById('main').innerHTML = `
      <div class="empty-state">
        <div class="icon">📋</div>
        <p>Onboard a client first to use the Monthly SOP.</p>
        <a href="onboarding.html" style="color:var(--orange);font-size:0.82rem;margin-top:0.5rem;">Start onboarding →</a>
      </div>`;
    document.getElementById('progressBlock').style.display = 'none';
    document.getElementById('timeBlock').style.display = 'none';
    return;
  }

  const client = clients[activeIdx];
  const tier = getClientTier(client);
  const key = getCheckKey(activeIdx);
  if (!checkState[key]) checkState[key] = {};
  const checks = checkState[key];

  // Visible steps for this tier
  const visibleSteps = PHASES.flatMap(p => p.steps).filter(s => stepApplies(s, tier));
  const totalSteps = visibleSteps.length;
  const doneSteps  = visibleSteps.filter(s => checks[s.id]).length;
  const pct        = totalSteps > 0 ? Math.round((doneSteps / totalSteps) * 100) : 0;

  document.getElementById('progressBlock').style.display = 'block';
  document.getElementById('timeBlock').style.display = 'block';
  document.getElementById('progressPct').textContent  = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressDone').textContent = doneSteps + ' done';
  document.getElementById('progressTotal').textContent = totalSteps + ' steps';

  const tierTimes = {
    founder: [
      { label: 'Prep', val: '10 min' }, { label: 'Captions', val: '30 min' },
      { label: 'Calendar', val: '15 min' }, { label: 'Delivery', val: '10 min' },
      { label: 'Total', val: '~1 hr', cls: 'time-total' },
    ],
    growth: [
      { label: 'Prep', val: '10 min' }, { label: 'Captions', val: '30 min' },
      { label: 'Graphics', val: '60 min' }, { label: 'Calendar', val: '15 min' },
      { label: 'Delivery', val: '10 min' }, { label: 'Total', val: '~2 hrs', cls: 'time-total' },
    ],
    premium: [
      { label: 'Prep', val: '10 min' }, { label: 'Captions', val: '30 min' },
      { label: 'Graphics', val: '60 min' }, { label: 'Calendar', val: '15 min' },
      { label: 'Scheduling', val: '45 min' }, { label: 'Report', val: '10 min' },
      { label: 'Delivery', val: '10 min' }, { label: 'Total', val: '~3 hrs', cls: 'time-total' },
    ],
  };
  document.getElementById('timeRows').innerHTML = (tierTimes[tier] || tierTimes.founder)
    .map(r => `<div class="time-row"><span class="time-label">${r.label}</span><span class="time-val ${r.cls||''}">${r.val}</span></div>`)
    .join('');

  const allDone = doneSteps === totalSteps && totalSteps > 0;

  let html = `
    <div class="delivery-banner">
      <div class="delivery-icon">💡</div>
      <div class="delivery-text">
        <strong>Delivery:</strong> Email a Google Drive folder link with all files organized by client name and month.
        Folder: <strong>${client.name.replace(/\s/g,'_')}_${getMonthLabel().replace(' ','_')}</strong> → Captions.docx, Calendar.pdf${tier !== 'founder' ? ', Graphics/' : ''}${tier === 'premium' ? ', Report.pdf' : ''}.
      </div>
    </div>
    <div class="complete-banner ${allDone ? 'show' : ''}">
      <div style="font-size:1.4rem">✅</div>
      <div class="complete-text"><strong>${client.name} — ${getMonthLabel()} is done.</strong> All ${totalSteps} steps complete. Ready to deliver.</div>
    </div>
  `;

  PHASES.forEach(phase => {
    const phaseSteps = phase.steps.filter(s => stepApplies(s, tier));
    if (phaseSteps.length === 0) return;

    html += `
      <div class="phase">
        <div class="phase-header">
          <div class="phase-num">PHASE ${phase.num}</div>
          <div class="phase-title">${phase.title}</div>
          <div class="phase-line"></div>
          <div class="phase-time">${phase.time}</div>
        </div>
        <div class="steps">
    `;

    phase.steps.forEach(step => {
      const applies = stepApplies(step, tier);
      const locked  = !applies;
      const done    = checks[step.id] || false;
      const tierBadge = step.tiers.includes('all')
        ? '<span class="step-tier-badge badge-all">All tiers</span>'
        : step.tiers.includes('premium') && !step.tiers.includes('growth')
          ? '<span class="step-tier-badge badge-premium">Premium</span>'
          : '<span class="step-tier-badge badge-growth">Growth+</span>';

      html += `
        <div class="step ${done ? 'done' : ''} ${locked ? 'tier-locked' : ''}" onclick="${locked ? '' : `toggleStep('${step.id}')`}">
          <div class="step-check"><span class="step-check-icon">✓</span></div>
          <div>
            <div class="step-title">${step.title}</div>
            <div class="step-desc">${step.desc}</div>
            <span class="step-tool ${step.toolClass}">${step.tool}</span>
            ${locked ? `<div class="locked-notice">Not included in ${tier.charAt(0).toUpperCase()+tier.slice(1)} tier</div>` : ''}
          </div>
          ${tierBadge}
        </div>
      `;
    });

    html += `</div></div>`;
  });

  document.getElementById('main').innerHTML = html;
}

function toggleStep(stepId) {
  if (activeIdx === null) return;
  const key = getCheckKey(activeIdx);
  if (!checkState[key]) checkState[key] = {};
  checkState[key][stepId] = !checkState[key][stepId];
  saveChecks();
  render();
}

function resetChecklist() {
  if (activeIdx === null) return;
  if (!confirm('Reset all checkboxes for this client this month?')) return;
  const key = getCheckKey(activeIdx);
  checkState[key] = {};
  saveChecks();
  render();
}

// ── BOOT ──
populateMonths();
loadClients();
</script>
</body>
</html>
