<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curbloom C4 — Content Command Center</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700&family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --green: #1e4d2b;
  --green-mid: #2d6a4f;
  --green-light: #52b788;
  --green-pale: #b7e4c7;
  --bg: #0b0f0d;
  --surface: #111714;
  --surface2: #171e1a;
  --border: #1e2e24;
  --border2: #253020;
  --text: #e8ede9;
  --text-muted: #7a9080;
  --text-dim: #3d5244;
}

body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

.header { background: var(--surface); border-bottom: 2px solid var(--green-mid); padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; }
.logo { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; font-weight: 700; color: var(--green-light); letter-spacing: 2px; }
.logo-sub { font-family: 'DM Mono', monospace; font-size: 0.6rem; color: var(--text-muted); letter-spacing: 3px; text-transform: uppercase; margin-top: -2px; }
.header-badge { background: rgba(82,183,136,0.1); border: 1px solid var(--green-mid); border-radius: 20px; padding: 4px 14px; font-family: 'DM Mono', monospace; font-size: 0.68rem; color: var(--green-light); letter-spacing: 1px; }

.app { display: grid; grid-template-columns: 290px 1fr; min-height: calc(100vh - 64px); }

/* Sidebar */
.sidebar { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
.sidebar-top { padding: 1.2rem; flex: 1; overflow-y: auto; }
.sidebar-label { font-family: 'DM Mono', monospace; font-size: 0.6rem; letter-spacing: 2px; text-transform: uppercase; color: var(--green-light); margin-bottom: 0.75rem; }

.client-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 0.85rem 1rem; margin-bottom: 0.5rem; cursor: pointer; transition: all 0.18s; position: relative; overflow: hidden; }
.client-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: transparent; transition: background 0.18s; }
.client-card:hover::before, .client-card.active::before { background: var(--green-light); }
.client-card:hover { border-color: var(--green-mid); }
.client-card.active { border-color: var(--green-mid); background: rgba(82,183,136,0.05); }
.client-name { font-weight: 600; font-size: 0.88rem; color: var(--text); }
.client-sub { font-size: 0.7rem; color: var(--green-light); margin-top: 2px; }
.client-community { font-family: 'DM Mono', monospace; font-size: 0.62rem; color: var(--text-dim); margin-top: 3px; }
.excl-badge { display: inline-block; background: rgba(90,26,122,0.2); border: 1px solid #5a1a7a; color: #c084fc; font-family: 'DM Mono', monospace; font-size: 0.58rem; padding: 1px 7px; border-radius: 8px; margin-top: 5px; letter-spacing: 0.5px; }

.sidebar-actions { padding: 1rem 1.2rem; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 0.5rem; }
.add-btn { background: transparent; border: 1px dashed var(--green-mid); border-radius: 8px; padding: 0.65rem; color: var(--green-light); font-size: 0.78rem; cursor: pointer; transition: all 0.2s; font-family: 'DM Sans', sans-serif; }
.add-btn:hover { background: rgba(82,183,136,0.08); }
.back-btn { background: transparent; border: 1px solid var(--border2); border-radius: 8px; padding: 0.55rem; color: var(--text-muted); font-size: 0.72rem; cursor: pointer; transition: all 0.2s; font-family: 'DM Sans', sans-serif; text-decoration: none; display: block; text-align: center; }
.back-btn:hover { border-color: var(--green-mid); color: var(--green-light); }

/* Main */
.main { overflow-y: auto; }
.view-content { padding: 1.4rem 1.8rem; }

/* Stats */
.stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.75rem; margin-bottom: 1.2rem; }
.stat-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 0.85rem 1rem; }
.stat-val { font-family: 'DM Mono', monospace; font-size: 1.4rem; font-weight: 500; color: var(--green-light); }
.stat-label { font-family: 'DM Mono', monospace; font-size: 0.6rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-top: 3px; }

/* Exclusivity banner */
.excl-banner { background: rgba(90,26,122,0.12); border: 1px solid #5a1a7a; border-radius: 10px; padding: 0.75rem 1.1rem; margin-bottom: 1.2rem; display: flex; align-items: center; gap: 0.75rem; }
.excl-text { font-size: 0.78rem; color: #c084fc; line-height: 1.5; }
.excl-text strong { color: #d4a0f0; }

/* Calendar */
.section-divider { font-family: 'DM Mono', monospace; font-size: 0.6rem; letter-spacing: 2px; text-transform: uppercase; color: var(--green-light); margin: 1.2rem 0 0.75rem; display: flex; align-items: center; gap: 0.5rem; }
.section-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

.cal-header { display: grid; grid-template-columns: 44px 110px 140px 1fr 110px; background: var(--green-mid); border-radius: 8px 8px 0 0; overflow: hidden; }
.cal-hcell { padding: 0.55rem 0.7rem; font-family: 'DM Mono', monospace; font-size: 0.6rem; letter-spacing: 1.5px; text-transform: uppercase; color: var(--green-pale); font-weight: 500; }
.cal-body { border: 1px solid var(--border); border-top: none; border-radius: 0 0 8px 8px; overflow: hidden; }
.cal-row { display: grid; grid-template-columns: 44px 110px 140px 1fr 110px; border-bottom: 1px solid var(--border); transition: background 0.12s; cursor: pointer; }
.cal-row:last-child { border-bottom: none; }
.cal-row:hover { background: var(--surface2); }
.cal-row.selected-row { background: rgba(82,183,136,0.06); }
.cal-cell { padding: 0.6rem 0.7rem; font-size: 0.78rem; border-right: 1px solid var(--border); display: flex; align-items: center; }
.cal-cell:last-child { border-right: none; }
.day-cell { justify-content: center; font-family: 'DM Mono', monospace; font-weight: 500; color: var(--green-light); font-size: 0.85rem; }
.week-divider { grid-column: 1/-1; background: rgba(82,183,136,0.04); padding: 0.4rem 0.7rem; font-family: 'DM Mono', monospace; font-size: 0.6rem; letter-spacing: 2px; text-transform: uppercase; color: #f4a261; font-weight: 500; cursor: default; border-bottom: 1px solid var(--border); }

.badge { padding: 2px 8px; border-radius: 10px; font-family: 'DM Mono', monospace; font-size: 0.62rem; font-weight: 500; letter-spacing: 0.3px; white-space: nowrap; }
.b-ig { background: rgba(90,26,122,0.2); color: #c084fc; border: 1px solid #5a1a7a; }
.b-fb { background: rgba(26,26,122,0.2); color: #60a5fa; border: 1px solid #1a2a7a; }
.b-market { background: rgba(82,183,136,0.12); color: var(--green-light); border: 1px solid var(--green-mid); }
.b-edu { background: rgba(255,209,102,0.1); color: #ffd166; border: 1px solid #5a5a1a; }
.b-engage { background: rgba(244,162,97,0.1); color: #f4a261; border: 1px solid #5a2a1a; }
.b-social { background: rgba(144,184,248,0.1); color: #90b8f8; border: 1px solid #2a2a6a; }
.b-lead { background: rgba(208,160,240,0.1); color: #d4a0f0; border: 1px solid #5a1a5a; }
.b-trust { background: rgba(116,212,212,0.1); color: #74d4d4; border: 1px solid #1a5a5a; }

.hook-cell { color: var(--text); font-size: 0.77rem; line-height: 1.4; flex: 1; }
.view-btn { background: transparent; border: 1px solid var(--border2); border-radius: 6px; padding: 3px 9px; color: var(--green-light); font-size: 0.68rem; cursor: pointer; transition: all 0.15s; white-space: nowrap; font-family: 'DM Sans', sans-serif; }
.view-btn:hover { background: rgba(82,183,136,0.08); border-color: var(--green-light); }

/* Caption panel */
.caption-panel { background: var(--surface2); border: 1px solid var(--green-mid); border-radius: 12px; padding: 1.3rem; margin-top: 1.2rem; }
.cp-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; }
.cp-title { font-family: 'DM Mono', monospace; font-size: 0.65rem; letter-spacing: 1.5px; text-transform: uppercase; color: var(--green-light); }
.cp-hook { font-size: 0.78rem; color: var(--text-muted); font-style: italic; margin-bottom: 0.75rem; }
.cp-body { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 1.1rem; font-size: 0.82rem; line-height: 1.85; color: var(--text); white-space: pre-wrap; }
.cp-meta { display: flex; align-items: center; gap: 0.75rem; margin-top: 0.75rem; }
.copy-btn { background: transparent; border: 1px solid var(--green-mid); border-radius: 6px; padding: 5px 14px; color: var(--green-light); font-size: 0.75rem; cursor: pointer; transition: all 0.2s; font-family: 'DM Sans', sans-serif; }
.copy-btn:hover { background: rgba(82,183,136,0.08); }
.copy-btn.done { background: var(--green-mid); color: var(--green-pale); }
.cp-tip { background: rgba(82,183,136,0.06); border-left: 3px solid var(--green-light); padding: 0.55rem 0.75rem; border-radius: 0 6px 6px 0; font-size: 0.72rem; color: var(--green-light); margin-top: 0.75rem; }
.canva-note { font-size: 0.68rem; color: var(--text-dim); }

/* Tone tags */
.tone-display { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 0.5rem; }
.tone-tag { background: var(--surface2); border: 1px solid var(--green-mid); border-radius: 12px; padding: 2px 9px; font-family: 'DM Mono', monospace; font-size: 0.62rem; color: var(--green-light); }

/* Empty state */
.no-client { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 70vh; gap: 1rem; text-align: center; }
.no-client p { font-size: 0.82rem; max-width: 280px; line-height: 1.7; color: var(--text-muted); }
.gen-btn { background: linear-gradient(135deg, var(--green), var(--green-mid)); border: none; border-radius: 8px; padding: 0.75rem 1.8rem; color: white; font-weight: 600; font-size: 0.85rem; cursor: pointer; letter-spacing: 0.5px; transition: all 0.2s; font-family: 'DM Sans', sans-serif; text-decoration: none; display: inline-block; }
.gen-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(82,183,136,0.3); }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="logo">Curbloom</div>
    <div class="logo-sub">Content Command Center — C4</div>
  </div>
  <div class="header-badge">Exclusive Territory Model</div>
</div>

<div class="app">
  <div class="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-label">Active Clients</div>
      <div id="clientList"></div>
    </div>
    <div class="sidebar-actions">
      <button class="add-btn" onclick="window.location.href='onboarding.html'">+ Onboard New Client</button>
      <a href="index.html" class="back-btn">← The Playbook</a>
    </div>
  </div>

  <div class="main" id="mainArea">
    <div class="no-client">
      <div style="font-size:2.5rem;">🌱</div>
      <p>No clients loaded. Add your first client through the onboarding questionnaire.</p>
      <a href="onboarding.html" class="gen-btn" style="margin-top:0.5rem;">Start Onboarding</a>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'curbloom_clients';
let clients = [];
let activeIdx = null;
let selectedDay = null;

const contentPlan = [
  { week: "Week 1 — Establish Authority", days: [
    { day:1, platform:"Instagram", type:"Market Update", format:"Carousel (3 slides)" },
    { day:2, platform:"Facebook", type:"Personality/Trust", format:"Photo + Caption" },
    { day:3, platform:"Instagram", type:"Educational", format:"Reel (30 sec)" },
    { day:4, platform:"Facebook", type:"Engagement", format:"Poll Post" },
    { day:5, platform:"Instagram", type:"Lead Gen Hook", format:"Static + CTA" },
    { day:6, platform:"Instagram", type:"Personality/Trust", format:"Reel" },
    { day:7, platform:"Facebook", type:"Social Proof", format:"Client Win" },
  ]},
  { week: "Week 2 — Educate & Generate Leads", days: [
    { day:8, platform:"Instagram", type:"Educational", format:"Carousel (5 slides)" },
    { day:9, platform:"Facebook", type:"Market Update", format:"Graphic + Caption" },
    { day:10, platform:"Instagram", type:"Engagement", format:"Reel (trending audio)" },
    { day:11, platform:"Facebook", type:"Lead Gen Hook", format:"Video + CTA" },
    { day:12, platform:"Instagram", type:"Social Proof", format:"Client Win Post" },
    { day:13, platform:"Instagram", type:"Educational", format:"Carousel (4 slides)" },
    { day:14, platform:"Facebook", type:"Personality/Trust", format:"Text Post" },
  ]},
  { week: "Week 3 — Build Trust & Deepen Engagement", days: [
    { day:15, platform:"Instagram", type:"Market Update", format:"Reel or Static" },
    { day:16, platform:"Facebook", type:"Engagement", format:"Question Post" },
    { day:17, platform:"Instagram", type:"Educational", format:"Carousel" },
    { day:18, platform:"Facebook", type:"Lead Gen Hook", format:"Image + CTA" },
    { day:19, platform:"Instagram", type:"Personality/Trust", format:"Reel" },
    { day:20, platform:"Facebook", type:"Social Proof", format:"Testimonial Graphic" },
    { day:21, platform:"Instagram", type:"Engagement", format:"This or That" },
  ]},
  { week: "Week 4 — Convert & Close", days: [
    { day:22, platform:"Instagram", type:"Educational", format:"Carousel" },
    { day:23, platform:"Facebook", type:"Market Update", format:"Graphic Post" },
    { day:24, platform:"Instagram", type:"Lead Gen Hook", format:"Reel or Static" },
    { day:25, platform:"Facebook", type:"Educational", format:"Text + Image" },
    { day:26, platform:"Instagram", type:"Personality/Trust", format:"Reel" },
    { day:27, platform:"Facebook", type:"Engagement", format:"Trivia Post" },
    { day:28, platform:"Instagram", type:"Social Proof", format:"Results Carousel" },
    { day:29, platform:"Instagram", type:"Market Update", format:"Reel" },
    { day:30, platform:"Facebook", type:"Lead Gen Hook", format:"Image + Strong CTA" },
  ]},
];

function bClass(type) {
  const m = {"Market Update":"b-market","Educational":"b-edu","Engagement":"b-engage","Social Proof":"b-social","Lead Gen Hook":"b-lead","Personality/Trust":"b-trust"};
  return m[type] || "b-market";
}

// ── Load from localStorage ──
function loadClients() {
  try {
    clients = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  } catch(e) { clients = []; }
  if (clients.length > 0) {
    activeIdx = 0;
    renderSidebar();
    renderClient(0);
  }
}

// ── Tone-aware generation ──
function buildVoice(client) {
  const tones = client.tones || [];
  let closing = "— " + client.name;
  if (tones.includes("Warm & friendly")) closing = "Always here if you have questions. 😊\n— " + client.name;
  if (tones.includes("Direct & bold")) closing = "Let's talk.\n— " + client.name;
  if (tones.includes("Motivational")) closing = "Let's build something. 💪\n— " + client.name;
  if (tones.includes("Humorous")) closing = "Okay, that's enough from me. 😄\n— " + client.name;
  return { closing };
}

function generateHook(client, day, type) {
  const c = client.community || "this area";
  const m = client.market || "the local area";
  const tones = client.tones || [];
  const isHumorous = tones.includes("Humorous");
  const isDirect = tones.includes("Direct & bold");
  const personal = client.personal || "";

  const hooks = {
    "Market Update": [
      `What's happening in ${c} right now — the numbers you need to see`,
      `${c} home values shifted this month — here's your update`,
      `The ${m} market right now: what buyers and sellers need to know`,
      `End of month snapshot: ${c} real estate by the numbers`,
      `${m} market update — don't make a move without seeing this`,
    ],
    "Educational": [
      `3 things nobody tells you about buying in ${m}`,
      `How to buy a home in ${m} — step by step, no jargon`,
      `Renting vs. buying in ${m} — the honest breakdown`,
      isDirect ? `Stop guessing. Here's what buying in ${m} actually costs.` : `What does buying in ${m} actually cost? Full breakdown.`,
      `How much home can you actually afford in ${m} right now?`,
    ],
    "Engagement": [
      `Quick question for ${m} families — what matters most in a new home?`,
      isHumorous ? `${m} home buyers, be honest... which one are you? 😂` : `${m} neighborhood edition: this or that? 🏡`,
      `What's your biggest fear about buying a home right now?`,
      isHumorous ? `${m} real estate trivia — bet you get this wrong 😏` : `${m} real estate trivia — can you guess?`,
    ],
    "Social Proof": [
      `Another family just found their home in ${c} — here's their story`,
      client.recentWin ? `${client.recentWin} — here's how we made it happen` : `This month's win — here's what it looked like`,
      `"We almost gave up. Then this happened." — a client story`,
      `This month's results from ${c}`,
    ],
    "Lead Gen Hook": [
      `Thinking about moving to ${m}? Read this first.`,
      `What's your home actually worth in ${m} right now?`,
      isDirect ? `Selling soon? Stop. Read this first.` : `Selling in the next 6 months? Do this now.`,
      `First-time buyers: your free ${m} guide is here`,
      isDirect ? `Ready to move in ${m}? Let's talk this week. No fluff.` : `Ready to buy or sell in ${m}? Let's talk this week.`,
    ],
    "Personality/Trust": [
      personal ? `${personal.split(',')[0]} — and still finding homes for families` : `Behind the scenes: a week in the life`,
      `Why I got into this — and why I'm still here`,
      isHumorous ? `Things clients say vs. what they actually mean 😂` : `The honest side of this job nobody talks about`,
      `What showing up every day in this business actually looks like`,
    ],
  };
  const opts = hooks[type] || hooks["Market Update"];
  return opts[(day - 1) % opts.length];
}

function generateCaption(client, day, type, platform) {
  const c = client.community || "this area";
  const m = client.market || "the local area";
  const tones = client.tones || [];
  const { closing } = buildVoice(client);
  const isWarm = tones.includes("Warm & friendly");
  const isDirect = tones.includes("Direct & bold");
  const isHumorous = tones.includes("Humorous");
  const isCasual = tones.includes("Casual");
  const personal = client.personal || "";
  const tags = `#${c.replace(/[\s,\/]/g,'')} #${m.replace(/[\s,\/]/g,'')} #RealEstate #HomeBuying`;

  const captions = {
    "Market Update": `${isDirect ? "Here's the data. No fluff." : isWarm ? "Whether you're thinking about buying or selling, this is the update you need." : "If you're watching the market, this is the update you need."}\n\n${c} is ${isDirect ? "moving. Here's the breakdown." : "on the move, and here's what that means for you."} ${platform === "Instagram" ? "Swipe through for the full picture — save this one." : "Here's what's shifted in the last 30 days and what it means for your plans."}\n\nQuestions? ${isDirect ? "DM me." : "My DMs are always open. 🏡"}\n\n${closing}\n\n${tags}`,

    "Educational": `${isHumorous ? "Real estate jargon exists to confuse you. Fight back. 😤" : isDirect ? "Nobody explains this clearly. Here it is." : "This is the stuff your agent should be telling you — but usually doesn't."}\n\n${platform === "Instagram" ? "Swipe through. Save this. Send it to someone who needs it." : "Read this before you make a move — and share it with someone thinking about buying."}\n\n${isWarm ? "Questions? I'm always happy to help." : "Questions? Drop them below."}\n\n${closing}\n\n${tags}`,

    "Engagement": `${isHumorous ? "Okay I need to know 😂" : `Genuine question for my people in ${m}:`}\n\nDrop your answer in the comments. ${isWarm ? "I read every single one." : isDirect ? "I read everything." : "Every answer helps me serve you better."}\n\n${isCasual ? `If you just wanna chat about the market, hit my DMs 👋` : `And if you want to talk specifics about ${c} right now — DMs are open.`}\n\n${closing}`,

    "Social Proof": `${isWarm ? "This one meant a lot to me. 🏡" : isDirect ? "Results." : "This is why I do what I do."}\n\n${client.recentWin || `Another family found their home in ${c}`}. ${isHumorous ? "Sometimes this job is pretty great. 😄" : "Every closing is a reminder of why this work matters."}\n\n${isDirect ? "Want in? DM me." : `If your family is ready to make a move, let's start the conversation. 🏡✅`}\n\n${closing}\n\n${tags} #JustClosed`,

    "Lead Gen Hook": `${isDirect ? "Quick." : isWarm ? "Hey —" : "If you've been thinking about this,"} ${isDirect ? `DM me 'GUIDE' and I'll send you everything you need to know about buying in ${m}. No pitch.` : `I put together a free guide covering everything you need to know about buying${c !== "this area" ? " in " + c : ""} — timeline, costs, what to avoid, all of it.`}\n\n${isDirect ? "Zero fluff." : "Zero cost, zero pressure."} DM me ${isDirect ? "'NOW'" : "'GUIDE'"} and I'll send it straight to you. 📩\n\n${closing}\n\n${tags}`,

    "Personality/Trust": `${personal ? `${personal.split(',')[0].trim()}. ` : ""}${isHumorous ? "Nobody said this job was glamorous. 😂 But it's mine and I love it." : isDirect ? "This is the job. Wouldn't trade it." : "Grateful for every day I get to do work that actually matters for people."}\n\n${isCasual ? "If you ever wanna link up and talk about making a move — you know where I'm at." : `If you're looking for someone who's going to show up for you — let's talk.`} 💪\n\n${closing}\n\n${tags}`,
  };

  return captions[type] || captions["Market Update"];
}

function generateTip(type) {
  const tips = {
    "Market Update": "Pull real stats from your MLS or Realtor.com. Replace placeholders before scheduling.",
    "Educational": "Open with the hook word-for-word on camera. Pair the Reel with a save-worthy carousel.",
    "Engagement": "Reply to every comment in the first hour — signals the algorithm to push the post further.",
    "Social Proof": "Real closing photo = 3x the engagement. Get permission first, then tag the community.",
    "Lead Gen Hook": "Set up a quick DM response before posting. Speed of reply is everything.",
    "Personality/Trust": "Raw and real beats polished every time for this content type. Phone video is perfect.",
  };
  return tips[type] || "Customize before posting.";
}

function renderSidebar() {
  document.getElementById('clientList').innerHTML = clients.map((c, i) => `
    <div class="client-card ${i === activeIdx ? 'active' : ''}" onclick="selectClient(${i})">
      <div class="client-name">${c.name}</div>
      <div class="client-sub">${c.agentType || c.type || 'Realtor'}</div>
      <div class="client-community">${c.community} · ${c.market}</div>
      <div class="excl-badge">Exclusive Territory</div>
    </div>
  `).join('');
}

function selectClient(idx) {
  activeIdx = idx;
  selectedDay = null;
  renderSidebar();
  renderClient(idx);
}

function renderClient(idx) {
  const c = clients[idx];
  const main = document.getElementById('mainArea');

  let calRows = '';
  contentPlan.forEach(week => {
    calRows += `<div class="cal-row"><div class="week-divider">📅 ${week.week}</div></div>`;
    week.days.forEach(d => {
      const hook = generateHook(c, d.day, d.type);
      const safeHook = hook.replace(/\\/g,'\\\\').replace(/`/g,"'").replace(/"/g,'&quot;');
      calRows += `
        <div class="cal-row ${selectedDay === d.day ? 'selected-row' : ''}" onclick="showCaption(${idx}, ${d.day}, '${d.type}', '${d.platform}', \`${safeHook}\`)">
          <div class="cal-cell day-cell">${d.day}</div>
          <div class="cal-cell"><span class="badge ${d.platform==='Instagram'?'b-ig':'b-fb'}">${d.platform}</span></div>
          <div class="cal-cell"><span class="badge ${bClass(d.type)}">${d.type}</span></div>
          <div class="cal-cell"><div class="hook-cell">${hook}</div></div>
          <div class="cal-cell"><button class="view-btn" onclick="event.stopPropagation()">View Caption</button></div>
        </div>`;
    });
  });

  const toneDisplay = c.tones && c.tones.length
    ? `<div class="tone-display">${c.tones.map(t => `<span class="tone-tag">${t}</span>`).join('')}</div>`
    : '';

  main.innerHTML = `
    <div class="view-content">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.2rem;">
        <div>
          <div style="font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:700;color:var(--text);">${c.name}</div>
          <div style="font-family:'DM Mono',monospace;font-size:0.68rem;color:var(--green-light);margin-top:3px;">${c.community} · ${c.market} · ${c.agentType || c.type || 'Realtor'}</div>
          ${toneDisplay}
        </div>
      </div>

      <div class="excl-banner">
        <div class="excl-text">🔒 <strong>Exclusive Territory:</strong> ${c.community}, ${c.market} is locked to ${c.name}. No other Curbloom client will receive content for this market.</div>
      </div>

      <div class="stats-row">
        <div class="stat-card"><div class="stat-val">30</div><div class="stat-label">Posts / Month</div></div>
        <div class="stat-card"><div class="stat-val">2</div><div class="stat-label">Platforms</div></div>
        <div class="stat-card"><div class="stat-val">${c.tones ? c.tones.length : 0}</div><div class="stat-label">Tone Markers</div></div>
        <div class="stat-card"><div class="stat-val">~10h</div><div class="stat-label">Monthly Work</div></div>
      </div>

      <div class="section-divider">30-Day Content Calendar</div>
      <div class="cal-header">
        <div class="cal-hcell" style="text-align:center;">Day</div>
        <div class="cal-hcell">Platform</div>
        <div class="cal-hcell">Type</div>
        <div class="cal-hcell">Hook / Topic</div>
        <div class="cal-hcell">Action</div>
      </div>
      <div class="cal-body">${calRows}</div>
      <div id="captionArea"></div>
    </div>
  `;
}

function showCaption(clientIdx, day, type, platform, hook) {
  selectedDay = day;
  const c = clients[clientIdx];
  const caption = generateCaption(c, day, type, platform);
  const tip = generateTip(type);

  // Highlight selected row
  document.querySelectorAll('.cal-row').forEach(r => r.classList.remove('selected-row'));

  document.getElementById('captionArea').innerHTML = `
    <div class="caption-panel">
      <div class="cp-header">
        <div class="cp-title">Day ${day} — ${platform} · ${type}</div>
        <span class="badge ${platform==='Instagram'?'b-ig':'b-fb'}">${platform}</span>
      </div>
      <div class="cp-hook">"${hook}"</div>
      <div class="cp-body" id="capText">${caption}</div>
      <div class="cp-meta">
        <button class="copy-btn" id="cpyBtn" onclick="doCopy()">📋 Copy Caption</button>
        <span class="canva-note">Paste into Canva, Meta Business Suite, or Later</span>
      </div>
      <div class="cp-tip">💡 ${tip}</div>
    </div>
  `;
  document.getElementById('captionArea').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function doCopy() {
  const text = document.getElementById('capText').innerText;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('cpyBtn');
    btn.textContent = '✅ Copied!';
    btn.classList.add('done');
    setTimeout(() => { btn.textContent = '📋 Copy Caption'; btn.classList.remove('done'); }, 2000);
  });
}

// ── Boot ──
loadClients();
</script>
</body>
</html>
